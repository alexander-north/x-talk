name: Windows build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: 'Optional prior run with build artifacts, for desktop-test debugging only'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit || github.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp release from main
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/prepare-release.py "$RUN_NUMBER" --output "$GITHUB_OUTPUT"
  media:
    needs: prepare
    if: inputs.acceptance_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: scripts/build-media.sh
      - uses: actions/upload-artifact@v4
        with:
          name: media
          if-no-files-found: error
          path: |
            src-tauri/binaries/*.exe
            src-tauri/binaries/FFmpeg-LICENSE.txt
            src-tauri/binaries/NOTICE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          include-hidden-files: true
          if-no-files-found: error
          path: .tmp/media-build/ffmpeg-8.0.1.tar.xz
  windows:
    needs: [prepare, media]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: media
          path: src-tauri/binaries
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-source
          path: .tmp/media-build
      - run: rustup toolchain install 1.93.1 --component rustfmt --component clippy
      - run: npm ci
      - run: python -X warn_default_encoding -W error::EncodingWarning scripts/generate-notices.py
      - name: Verify release metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') { python scripts/release.py --tag $env:REF_NAME }
          else { python scripts/release.py }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m unittest discover -s tests/release -v
      - run: npm run check
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop,test-providers --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop --locked
      - name: Build installer
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if ($env:RELEASE_TAG) {
            if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is missing' }
            npm run desktop:build -- --config src-tauri/tauri.release.conf.json
          } else { npm run desktop:build }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject test providers in release builds
        run: |
          cmd /d /c "cargo check --manifest-path src-tauri/Cargo.toml --release --features desktop,test-providers --locked > .tmp\release-test-guard.log 2>&1"
          $failed = $LASTEXITCODE -ne 0
          if (!$failed -or !(Select-String -Path .tmp/release-test-guard.log -SimpleMatch 'test-providers is restricted to debug acceptance builds' -Quiet)) { throw 'Release test-provider guard was not verified' }
          exit 0
      - run: npm run desktop:test-build
      - name: Stage isolated acceptance executable
        run: |
          New-Item -ItemType Directory -Force .tmp/acceptance/binaries | Out-Null
          Copy-Item src-tauri/target/debug/x-talk.exe .tmp/acceptance/x-talk.exe
          Copy-Item src-tauri/binaries/* .tmp/acceptance/binaries/
          Copy-Item LICENSE,NOTICE .tmp/acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: .tmp/acceptance/*
      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $updater = @()
          if ($env:RELEASE_TAG) { $updater = @('--updater') }
          python scripts/release.py @updater --tag "v$version" --installer "src-tauri/target/release/bundle/nsis/x-talk_${version}_x64-setup.exe" --ffmpeg-source .tmp/media-build/ffmpeg-8.0.1.tar.xz --output .tmp/release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: x-talk-windows-x64
          include-hidden-files: true
          if-no-files-found: error
          path: .tmp/release-assets/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-guard-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: .tmp/release-test-guard.log
  desktop:
    needs: [prepare, windows]
    if: always() && (needs.windows.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.acceptance_run_id != ''))
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: x-talk-windows-x64
          path: .tmp/release-assets
          run-id: ${{ inputs.acceptance_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-build
          path: .tmp/acceptance
          run-id: ${{ inputs.acceptance_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: npm ci
      - name: Install matching WebDriver
        run: |
          cargo install tauri-driver --locked --version 2.0.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install-webdriver.ps1
      - name: Record the artifact version
        run: |
          $name = (Get-ChildItem .tmp/release-assets/*-setup.exe)[0].BaseName
          if ($name -notmatch '^x-talk_(\d+\.\d+\.\d+)_x64-setup$') { throw 'Unexpected installer filename' }
          "XTALK_EXPECTED_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install and smoke test actual installer
        run: |
          $installer = (Get-ChildItem .tmp/release-assets/*-setup.exe)[0].FullName
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $env:XTALK_APP_PATH = "$env:LOCALAPPDATA\x-talk\x-talk.exe"
          if (!(Test-Path $env:XTALK_APP_PATH)) { throw 'Installed application missing' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XTALK_UPGRADE_PHASE = 'seed'
          npm run test:e2e -- --spec tests/e2e/upgrade.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/release/seed_upgrade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Reinstallation failed' }
          $env:XTALK_UPGRADE_PHASE = 'verify'
          npm run test:e2e -- --spec tests/e2e/upgrade.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = "$env:LOCALAPPDATA\x-talk\uninstall.exe"
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $env:XTALK_APP_PATH) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $env:XTALK_APP_PATH) { throw 'Uninstall left the app executable behind' }
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Reinstall after uninstall failed' }
          $env:XTALK_UPGRADE_CLEANUP = '1'
          npm run test:e2e -- --spec tests/e2e/upgrade.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Final uninstall failed' }
      - name: Offline desktop acceptance
        env:
          XTALK_E2E_OFFLINE: '1'
          XTALK_APP_PATH: .tmp/acceptance/x-talk.exe
        run: npm run test:e2e
      - name: Signed update handoff and persistence
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ($env:RELEASE_TAG) {
            $installer = (Get-ChildItem .tmp/release-assets/*-setup.exe)[0].FullName
            $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw 'Update fixture install failed' }
            $env:XTALK_APP_PATH = "$env:LOCALAPPDATA\x-talk\x-talk.exe"
            $env:XTALK_UPGRADE_PHASE = 'seed'
            Remove-Item Env:XTALK_UPGRADE_CLEANUP -ErrorAction SilentlyContinue
            npm run test:e2e -- --spec tests/e2e/upgrade.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:XTALK_UPDATE_INSTALL = '1'
          }
          $env:XTALK_E2E_UPDATES = '1'
          $env:XTALK_APP_PATH = '.tmp/acceptance/x-talk.exe'
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:XTALK_E2E_UPDATES,Env:XTALK_UPDATE_INSTALL -ErrorAction SilentlyContinue
          if ($env:RELEASE_TAG) {
            $env:XTALK_APP_PATH = "$env:LOCALAPPDATA\x-talk\x-talk.exe"
            $env:XTALK_UPGRADE_PHASE = 'verify'
            $env:XTALK_UPGRADE_CLEANUP = '1'
            npm run test:e2e -- --spec tests/e2e/upgrade.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload non-sensitive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .tmp/offline-recorder.png
            .tmp/acceptance-ui.png
            .tmp/glass/*.png
            .tmp/glass/environment.json
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, windows, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: x-talk-windows-x64
          path: release-assets
      - name: Verify asset checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release.py --tag "$RELEASE_TAG"
          # Only the latest main revision may become the update feed.
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$MAIN_SHA"
          # A successful rerun does not overwrite an existing published release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          test -f release-assets/latest.json
          gh release create "$RELEASE_TAG" release-assets/* --latest --verify-tag --title "x-talk $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
