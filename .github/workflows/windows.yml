# Builds, verifies and (on main pushes) publishes x-talk for Windows x64 and macOS Apple Silicon.
# The file name and job names are referenced by .github/rulesets/main.ruleset.json.
name: Build, verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: 'Optional prior run with build artifacts, for desktop-test debugging only'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit || github.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Stamp release from main
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/prepare-release.py "$RUN_NUMBER" --output "$GITHUB_OUTPUT"
  media:
    needs: prepare
    if: inputs.acceptance_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: scripts/build-media.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media
          if-no-files-found: error
          path: |
            src-tauri/binaries/*.exe
            src-tauri/binaries/FFmpeg-LICENSE.txt
            src-tauri/binaries/NOTICE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-source
          include-hidden-files: true
          if-no-files-found: error
          path: .tmp/media-build/ffmpeg-8.0.1.tar.xz
  windows:
    needs: [prepare, media]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: media
          path: src-tauri/binaries
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-source
          path: .tmp/media-build
      - run: rustup toolchain install 1.93.1 --component rustfmt --component clippy
      - run: npm ci
      - run: python -X warn_default_encoding -W error::EncodingWarning scripts/generate-notices.py
      - name: Verify release metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') { python scripts/release.py --tag $env:REF_NAME }
          else { python scripts/release.py }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m unittest discover -s tests/release -v
      - run: npm run check
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop,test-providers --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop --locked
      # Always built without the updater key, so npm scripts, build.rs and proc-macros never see it.
      - name: Build installer
        run: |
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The only step that receives the key: it signs the NSIS installer, which is the v2 updater artifact.
      - name: Sign updater artifact
        if: needs.prepare.outputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is missing' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/x-talk_${version}_x64-setup.exe"
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer to sign is missing: $installer" }
          $signature = "$installer.sig"
          if (Test-Path -LiteralPath $signature) { Remove-Item -LiteralPath $signature }
          # --app-version binds the signature to this version; requireSignedVersion rejects it otherwise.
          npx --no -- tauri signer sign --app-version $version $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath $signature -PathType Leaf) -or !([string](Get-Content -Raw -LiteralPath $signature)).Trim()) { throw 'Updater signature was not produced' }
      - name: Check updater signature binding
        if: needs.prepare.outputs.tag != ''
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          python scripts/release.py check-signature --platform windows --version $version "src-tauri/target/release/bundle/nsis/x-talk_${version}_x64-setup.exe.sig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject test providers in release builds
        run: |
          cmd /d /c "cargo check --manifest-path src-tauri/Cargo.toml --release --features desktop,test-providers --locked > .tmp\release-test-guard.log 2>&1"
          $failed = $LASTEXITCODE -ne 0
          if (!$failed -or !(Select-String -Path .tmp/release-test-guard.log -SimpleMatch 'test-providers is restricted to debug acceptance builds' -Quiet)) { throw 'Release test-provider guard was not verified' }
          exit 0
      - run: npm run desktop:test-build
      - name: Stage isolated acceptance executable
        run: |
          New-Item -ItemType Directory -Force .tmp/acceptance/binaries | Out-Null
          Copy-Item src-tauri/target/debug/x-talk.exe .tmp/acceptance/x-talk.exe
          Copy-Item src-tauri/binaries/* .tmp/acceptance/binaries/
          Copy-Item LICENSE,NOTICE .tmp/acceptance/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: .tmp/acceptance/*
      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $updater = @()
          if ($env:RELEASE_TAG) { $updater = @('--updater') }
          python scripts/release.py windows @updater --tag "v$version" --installer "src-tauri/target/release/bundle/nsis/x-talk_${version}_x64-setup.exe" --ffmpeg-source .tmp/media-build/ffmpeg-8.0.1.tar.xz --output .tmp/release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x-talk-windows-x64
          include-hidden-files: true
          if-no-files-found: error
          path: .tmp/release-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-guard-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: .tmp/release-test-guard.log
  desktop:
    needs: [prepare, windows]
    if: always() && (needs.windows.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.acceptance_run_id != ''))
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: x-talk-windows-x64
          path: .tmp/release-assets
          run-id: ${{ inputs.acceptance_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acceptance-build
          path: .tmp/acceptance
          run-id: ${{ inputs.acceptance_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: npm ci
      - name: Install matching WebDriver
        run: |
          cargo install tauri-driver --locked --version 2.0.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install-webdriver.ps1
      - name: Record the artifact version
        run: |
          $name = (Get-ChildItem .tmp/release-assets/*-setup.exe)[0].BaseName
          if ($name -notmatch '^x-talk_(\d+\.\d+\.\d+)_x64-setup$') { throw 'Unexpected installer filename' }
          "XTALK_EXPECTED_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install and smoke test actual installer
        run: |
          $installer = (Get-ChildItem .tmp/release-assets/*-setup.exe)[0].FullName
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $env:XTALK_APP_PATH = "$env:LOCALAPPDATA\x-talk\x-talk.exe"
          if (!(Test-Path $env:XTALK_APP_PATH)) { throw 'Installed application missing' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XTALK_UPGRADE_PHASE = 'seed'
          npm run test:e2e -- --spec tests/e2e/upgrade.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/release/seed_upgrade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Reinstallation failed' }
          $env:XTALK_UPGRADE_PHASE = 'verify'
          npm run test:e2e -- --spec tests/e2e/upgrade.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = "$env:LOCALAPPDATA\x-talk\uninstall.exe"
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $env:XTALK_APP_PATH) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $env:XTALK_APP_PATH) { throw 'Uninstall left the app executable behind' }
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Reinstall after uninstall failed' }
          $env:XTALK_UPGRADE_CLEANUP = '1'
          npm run test:e2e -- --spec tests/e2e/upgrade.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Final uninstall failed' }
      - name: Offline desktop acceptance
        env:
          XTALK_E2E_OFFLINE: '1'
          XTALK_APP_PATH: .tmp/acceptance/x-talk.exe
        run: npm run test:e2e
      - name: Signed update handoff and persistence
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ($env:RELEASE_TAG) {
            $installer = (Get-ChildItem .tmp/release-assets/*-setup.exe)[0].FullName
            $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw 'Update fixture install failed' }
            $env:XTALK_APP_PATH = "$env:LOCALAPPDATA\x-talk\x-talk.exe"
            $env:XTALK_UPGRADE_PHASE = 'seed'
            Remove-Item Env:XTALK_UPGRADE_CLEANUP -ErrorAction SilentlyContinue
            npm run test:e2e -- --spec tests/e2e/upgrade.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:XTALK_UPDATE_INSTALL = '1'
          }
          $env:XTALK_E2E_UPDATES = '1'
          $env:XTALK_APP_PATH = '.tmp/acceptance/x-talk.exe'
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:XTALK_E2E_UPDATES,Env:XTALK_UPDATE_INSTALL -ErrorAction SilentlyContinue
          if ($env:RELEASE_TAG) {
            $env:XTALK_APP_PATH = "$env:LOCALAPPDATA\x-talk\x-talk.exe"
            $env:XTALK_UPGRADE_PHASE = 'verify'
            $env:XTALK_UPGRADE_CLEANUP = '1'
            npm run test:e2e -- --spec tests/e2e/upgrade.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload non-sensitive test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-test-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .tmp/offline-recorder.png
            .tmp/acceptance-ui.png
            .tmp/glass/*.png
            .tmp/glass/environment.json
  macos:
    # Apple Silicon only. Waits for the cheap Linux media job so a broken source pin never starts
    # (expensive) macOS minutes, and reuses its checksum-verified FFmpeg source archive.
    needs: [prepare, media]
    if: inputs.acceptance_run_id == ''
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Rust, C dependencies and FFmpeg all target the bundle's minimum macOS.
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The image's default Xcode is used; the media build records it in its manifest.
      - name: Confirm Apple Silicon runner
        run: |
          sw_vers
          if [ "$(uname -m)" != arm64 ] || [ "$(sysctl -n hw.optional.arm64)" != 1 ]; then
            echo "::error::Expected an arm64 macOS runner, got $(uname -m)"; exit 1
          fi
          xcodebuild -version
          clang --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-source
          path: .tmp/media-build
      - run: rustup toolchain install 1.93.1 --component rustfmt --component clippy
      - run: npm ci
      - run: python -m unittest discover -s tests/release -v
      - run: npm run check
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Native arm64 build from the same checksum-verified source and component set as Windows. Not
      # pinned: the tools built here are the ones shipped, and their checksums (with the source,
      # recipe and toolchain) go into media-build.json, which packaging verifies and publishes.
      - name: Build bundled media tools
        run: bash scripts/build-media.sh
      - name: Keep media build evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-macos-aarch64
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            src-tauri/binaries/ffmpeg
            src-tauri/binaries/ffprobe
            src-tauri/binaries/media-build.json
            .tmp/ffmpeg-config.log
      - run: python -X warn_default_encoding -W error::EncodingWarning scripts/generate-notices.py
      - name: Verify release metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then python scripts/release.py --tag "$REF_NAME"; else python scripts/release.py; fi
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop,test-providers --all-targets --locked -- -D warnings
      - name: Rust tests with the bundled media tools
        env:
          XTALK_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg
          XTALK_FFPROBE: ${{ github.workspace }}/src-tauri/binaries/ffprobe
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop --locked
      # Always built without the updater key, so npm scripts, build.rs and proc-macros never see it.
      # Ad-hoc signed (bundle.macOS.signingIdentity "-"); no Apple Developer ID or notarization.
      - name: Build app and disk image
        run: |
          # hdiutil on hosted runners occasionally fails with "Resource busy"; a retry only re-bundles.
          npm run desktop:build || { echo '::warning::Desktop build failed; retrying once'; npm run desktop:build; }
      - name: Create updater archive and smoke-check the bundle
        run: bash scripts/macos-bundle.sh
      # The only step that receives the key: it signs the .app.tar.gz, the macOS updater artifact.
      - name: Sign updater artifact
        if: needs.prepare.outputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo 'Updater signing key is missing' >&2; exit 1; fi
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          archive="src-tauri/target/release/bundle/macos/x-talk_${version}_aarch64.app.tar.gz"
          if [ ! -f "$archive" ]; then echo "Updater archive to sign is missing: $archive" >&2; exit 1; fi
          rm -f "$archive.sig"
          # --app-version binds the signature to this version; requireSignedVersion rejects it otherwise.
          npx --no -- tauri signer sign --app-version "$version" "$archive"
          if [ ! -s "$archive.sig" ]; then echo 'Updater signature was not produced' >&2; exit 1; fi
      - name: Check updater signature binding
        if: needs.prepare.outputs.tag != ''
        run: |
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          python scripts/release.py check-signature --platform macos --version "$version" "src-tauri/target/release/bundle/macos/x-talk_${version}_aarch64.app.tar.gz.sig"
      - name: Assemble macOS release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          updater=()
          if [ -n "$RELEASE_TAG" ]; then updater=(--updater); fi
          python scripts/release.py macos "${updater[@]}" --tag "v$version" --dmg "src-tauri/target/release/bundle/dmg/x-talk_${version}_aarch64.dmg" --app-archive "src-tauri/target/release/bundle/macos/x-talk_${version}_aarch64.app.tar.gz" --media-manifest src-tauri/binaries/media-build.json --output .tmp/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x-talk-macos-aarch64
          include-hidden-files: true
          if-no-files-found: error
          path: .tmp/release-assets/*
  release:
    # All or nothing: publishes only when every platform's build and the Windows desktop tests passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, windows, desktop, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: x-talk-windows-x64
          path: .tmp/platform-assets/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: x-talk-macos-aarch64
          path: .tmp/platform-assets/macos
      # Checks both platform sets against their checksums, signatures and names, then writes the
      # one latest.json (windows-x86_64 and darwin-aarch64) and SHA256SUMS.txt covering every asset.
      - name: Assemble the release for both platforms
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release.py publish-set --tag "$RELEASE_TAG" --windows .tmp/platform-assets/windows --macos .tmp/platform-assets/macos --output .tmp/release-assets
      - name: Verify asset checksums
        working-directory: .tmp/release-assets
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release.py --tag "$RELEASE_TAG"
          # Only the latest main revision may become the update feed.
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$MAIN_SHA"
          # A successful rerun does not overwrite an existing published release. gh uploads assets to a
          # draft and publishes it last, so a draft means an interrupted upload: fail instead of passing.
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              echo "::error::Draft release $RELEASE_TAG exists from an interrupted upload; delete it and re-run this job"; exit 1
            fi
            exit 0
          fi
          test -f .tmp/release-assets/latest.json
          gh release create "$RELEASE_TAG" .tmp/release-assets/* --latest --verify-tag --title "x-talk $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
